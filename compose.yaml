services:
  simple-repo-manager:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:80:3000"
      - "[::1]:80:3000"
